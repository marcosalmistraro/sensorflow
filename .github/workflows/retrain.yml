name: Weekly retrain

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual trigger from the Actions tab
    inputs:
      force_retrain:
        description: "Skip drift check and retrain unconditionally"
        required: false
        default: "false"

jobs:

  monitor:
    name: Drift check
    runs-on: ubuntu-latest
    outputs:
      retrain_required: ${{ steps.flag.outputs.retrain_required }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyTorch CPU
        run: |
          pip install --quiet \
            torch==2.2.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Download SMAP data
        env:
          PYTHONPATH: src
        run: python -m ingestion

      - name: Build features
        env:
          PYTHONPATH: src
        run: python -m features

      - name: Run drift monitor
        env:
          PYTHONPATH: src
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python -m monitor

      - name: Read retrain flag
        id: flag
        run: |
          REQUIRED=$(python -c "
          import json, sys
          flag = json.load(open('reports/retrain_flag.json'))
          print('true' if flag['retrain_required'] else 'false')
          ")
          echo "retrain_required=$REQUIRED" >> "$GITHUB_OUTPUT"
          echo "Drift flag: retrain_required=$REQUIRED"

      - name: Upload drift flag
        uses: actions/upload-artifact@v4
        with:
          name: drift-flag
          path: reports/retrain_flag.json

  # ---------------------------------------------------------------------------

  retrain:
    name: Retrain models
    runs-on: ubuntu-latest
    needs: monitor
    if: |
      needs.monitor.outputs.retrain_required == 'true' ||
      github.event.inputs.force_retrain == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyTorch CPU
        run: |
          pip install --quiet \
            torch==2.2.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Download SMAP data
        env:
          PYTHONPATH: src
        run: python -m ingestion

      - name: Build features
        env:
          PYTHONPATH: src
        run: python -m features

      - name: Train models
        env:
          PYTHONPATH: src
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          python -m train   # runs both IF and LSTM via __main__

      - name: Evaluate and promote champion
        env:
          PYTHONPATH: src
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python -m evaluate

      - name: Upload model artefacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models-${{ github.run_id }}
          path: |
            models/scaler.joblib
            models/isolation_forest.joblib
            models/lstm_autoencoder.pt
          retention-days: 30

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.run_id }}
          path: reports/

      - name: Commit updated flag and reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/retrain_flag.json
          git diff --staged --quiet || git commit -m "chore: update retrain flag [skip ci]"
          git push
